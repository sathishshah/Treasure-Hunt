<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKT Treasure Hunt</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Simple blinking caret for the title */
        .caret {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-900 text-green-400 font-mono min-h-screen flex items-center justify-center p-4">

    <div class="bg-black border-2 border-green-500 p-6 sm:p-8 rounded-lg shadow-lg w-full max-w-lg relative">
        <!-- Title Bar -->
        <div class="absolute -top-4 left-0 right-0 px-4">
            <div class="bg-gray-700 border-2 border-green-500 text-green-400 text-center py-1 rounded-t-lg">
                UCEK TERMINAL :: KKT_APP-OCALYPSE_v4.0
            </div>
        </div>

        <h1 class="text-xl sm:text-2xl font-bold mb-4 text-center text-white">
            > KKT APP-OCALYPSE <span class="caret">_</span>
        </h1>
        <p class="mb-6 text-sm sm:text-base">
            <span class="text-yellow-400">[ERROR]</span> College Wi-Fi is down. Rogue AI detected.
            <br>
            To find the treasure, you must find 7 'Pass-Fragments' (Keys) by visiting the 7 Hotspots in the Academic Building.
        </p>

        <!-- Message Box for success/error -->
        <div id="message-box" class="hidden p-3 rounded-md mb-4 text-center font-bold"></div>

        <!-- Input Fields for Keys -->
        <div class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="key1" class="block text-xs uppercase mb-1">Pass-Fragment_01:</label>
                    <input type="text" id="key1" name="key1" class="w-full bg-gray-800 border border-green-700 text-white p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" oninput="this.value = this.value.toUpperCase()" style="text-transform: uppercase;">
                </div>
                <div>
                    <label for="key2" class="block text-xs uppercase mb-1">Pass-Fragment_02:</label>
                    <input type="text" id="key2" name="key2" class="w-full bg-gray-800 border border-green-700 text-white p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" oninput="this.value = this.value.toUpperCase()" style="text-transform: uppercase;">
                </div>
                <div>
                    <label for="key3" class="block text-xs uppercase mb-1">Pass-Fragment_03:</label>
                    <input type="text" id="key3" name="key3" class="w-full bg-gray-800 border border-green-700 text-white p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" oninput="this.value = this.value.toUpperCase()" style="text-transform: uppercase;">
                </div>
                <div>
                    <label for="key4" class="block text-xs uppercase mb-1">Pass-Fragment_04:</label>
                    <input type="text" id="key4" name="key4" class="w-full bg-gray-800 border border-green-700 text-white p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" oninput="this.value = this.value.toUpperCase()" style="text-transform: uppercase;">
                </div>
                <div>
                    <label for="key5" class="block text-xs uppercase mb-1">Pass-Fragment_05:</label>
                    <input type="text" id="key5" name="key5" class="w-full bg-gray-800 border border-green-700 text-white p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" oninput="this.value = this.value.toUpperCase()" style="text-transform: uppercase;">
                </div>
                <div>
                    <label for="key6" class="block text-xs uppercase mb-1">Pass-Fragment_06:</label>
                    <input type="text" id="key6" name="key6" class="w-full bg-gray-800 border border-green-700 text-white p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" oninput="this.value = this.value.toUpperCase()" style="text-transform: uppercase;">
                </div>
            </div>
            <div>
                <label for="key7" class="block text-xs uppercase mb-1">Pass-Fragment_07 (Final):</label>
                <input type="text" id="key7" name="key7" class="w-full bg-gray-800 border border-green-700 text-white p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" oninput="this.value = this.value.toUpperCase()" style="text-transform: uppercase;">
            </div>
        </div>

        <!-- Decrypt Button -->
        <button id="decrypt-button" class="mt-8 w-full bg-green-600 text-black font-bold py-3 px-4 rounded-md hover:bg-green-500 focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-offset-2 focus:ring-offset-black transition-all duration-200">
            RESTORE WI-FI
        </button>
    </div>

    <script>
        const button = document.getElementById('decrypt-button');
        const messageBox = document.getElementById('message-box');

        // Obfuscated answers - decode using character codes
        function getKeys() {
            return {
                key1: String.fromCharCode(87,72,65,84,83,65,80,80),
                key2: String.fromCharCode(73,78,83,84,65,71,82,65,77),
                key3: String.fromCharCode(83,87,73,71,71,89),
                key4: String.fromCharCode(90,69,80,84,79),
                key5: String.fromCharCode(71,80,65,89),
                key6: String.fromCharCode(83,80,79,84,73,70,89),
                key7: String.fromCharCode(76,73,78,75,69,68,73,78)
            };
        }
        
        const correctKeys = getKeys();

        button.addEventListener('click', () => {
            const userKeys = {
                key1: document.getElementById('key1').value.trim().toUpperCase(),
                key2: document.getElementById('key2').value.trim().toUpperCase(),
                key3: document.getElementById('key3').value.trim().toUpperCase(),
                key4: document.getElementById('key4').value.trim().toUpperCase(),
                key5: document.getElementById('key5').value.trim().toUpperCase(),
                key6: document.getElementById('key6').value.trim().toUpperCase(),
                key7: document.getElementById('key7').value.trim().toUpperCase()
            };

            let allCorrect = true;
            Object.keys(correctKeys).forEach(key => {
                if (userKeys[key] !== correctKeys[key]) {
                    allCorrect = false;
                }
            });

            if (allCorrect) {
                // SUCCESS
                messageBox.classList.remove('hidden', 'bg-red-900', 'text-red-300');
                messageBox.classList.add('bg-green-800', 'text-green-300');
                messageBox.innerHTML = `
                    <p class="text-xl">SYSTEM RESTORED!</p>
                    <p class="text-base mt-2">Wi-Fi is back online. The treasure is at the...</p>
                    <p class="text-3xl font-bold mt-2">OPEN STAGE</p>
                    <p class="text-base mt-2">Run! Show this screen to the coordinator.</p>
                `;
                // Disable all inputs
                document.querySelectorAll('input').forEach(input => input.disabled = true);
                button.disabled = true;
                button.textContent = "SYSTEM ONLINE";
            } else {
                // FAILURE
                messageBox.classList.remove('hidden', 'bg-green-800', 'text-green-300');
                messageBox.classList.add('bg-red-900', 'text-red-300');
                messageBox.textContent = "ACCESS DENIED. One or more fragments are corrupt. [CODE: 3rr0r]";
            }
        });
    </script>

</body>
</html>
