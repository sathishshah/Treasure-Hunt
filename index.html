<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKT Treasure Hunt</title>
    <style>
        /* Simple blinking caret for the title */
        .caret {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        
        /* Inline CSS for styling */
        body {
            background-color: #111827;
            color: #4ade80;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .container {
            background-color: #000;
            border: 2px solid #22c55e;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 32rem;
            position: relative;
            margin-top: 1rem;
        }
        
        .title-bar {
            position: absolute;
            top: -1rem;
            left: 0;
            right: 0;
            padding: 0 1rem;
        }
        
        .title-bar-content {
            background-color: #374151;
            border: 2px solid #22c55e;
            color: #4ade80;
            text-align: center;
            padding: 0.25rem;
            border-radius: 0.5rem 0.5rem 0 0;
            font-size: 0.875rem;
        }
        
        h1 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-align: center;
            color: #fff;
        }
        
        .intro {
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        
        .error {
            color: #facc15;
        }
        
        #message-box {
            padding: 0.75rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            text-align: center;
            font-weight: bold;
        }
        
        .key-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        
        @media (min-width: 640px) {
            .key-container {
                grid-template-columns: 1fr 1fr;
            }
            h1 {
                font-size: 1.875rem;
            }
            .intro {
                font-size: 1rem;
            }
            .container {
                padding: 2rem;
            }
        }
        
        .key-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }
        
        input {
            width: 100%;
            background-color: #1f2937;
            border: 1px solid #16a34a;
            color: #fff;
            padding: 0.5rem;
            border-radius: 0.375rem;
        }
        
        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #22c55e;
        }
        
        button {
            margin-top: 2rem;
            width: 100%;
            background-color: #16a34a;
            color: #000;
            font-weight: bold;
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:hover {
            background-color: #22c55e;
        }
        
        button:focus {
            outline: none;
            box-shadow: 0 0 0 2px #4ade80;
        }
        
        button:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        input:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .hidden {
            display: none;
        }
        
        .bg-red-900 {
            background-color: #7f1d1d;
        }
        
        .text-red-300 {
            color: #fca5a5;
        }
        
        .bg-green-800 {
            background-color: #166534;
        }
        
        .text-green-300 {
            color: #86efac;
        }

        .text-xl {
            font-size: 1.25rem;
        }
        
        .text-base {
            font-size: 1rem;
        }
        
        .text-3xl {
            font-size: 1.875rem;
        }
        
        .font-bold {
            font-weight: bold;
        }
        
        .mt-2 {
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Title Bar -->
        <div class="title-bar">
            <div class="title-bar-content">
                UCEK TERMINAL :: KKT_APP-OCALYPSE_v4.0
            </div>
        </div>

        <h1>
            > KKT APP-OCALYPSE <span class="caret">_</span>
        </h1>
        <p class="intro">
            <span class="error">[ERROR]</span> College Wi-Fi is down. Rogue AI detected.
            <br>
            To find the treasure, you must find 7 'Pass-Fragments' (Keys) by visiting the 7 Hotspots in the Academic Building.
        </p>

        <!-- Message Box for success/error -->
        <div id="message-box" class="hidden"></div>

        <!-- Input Fields for Keys -->
        <div class="key-container">
            <div class="key-group">
                <label for="key1">Pass-Fragment_01:</label>
                <input type="text" id="key1" name="key1" oninput="this.value = this.value.toUpperCase()" style="text-transform: uppercase;">
            </div>
            <div class="key-group">
                <label for="key2">Pass-Fragment_02:</label>
                <input type="text" id="key2" name="key2" oninput="this.value = this.value.toUpperCase()" style="text-transform: uppercase;">
            </div>
            <div class="key-group">
                <label for="key3">Pass-Fragment_03:</label>
                <input type="text" id="key3" name="key3" oninput="this.value = this.value.toUpperCase()" style="text-transform: uppercase;">
            </div>
            <div class="key-group">
                <label for="key4">Pass-Fragment_04:</label>
                <input type="text" id="key4" name="key4" oninput="this.value = this.value.toUpperCase()" style="text-transform: uppercase;">
            </div>
            <div class="key-group">
                <label for="key5">Pass-Fragment_05:</label>
                <input type="text" id="key5" name="key5" oninput="this.value = this.value.toUpperCase()" style="text-transform: uppercase;">
            </div>
            <div class="key-group">
                <label for="key6">Pass-Fragment_06:</label>
                <input type="text" id="key6" name="key6" oninput="this.value = this.value.toUpperCase()" style="text-transform: uppercase;">
            </div>
            <div class="key-group">
                <label for="key7">Pass-Fragment_07 (Final):</label>
                <input type="text" id="key7" name="key7" oninput="this.value = this.value.toUpperCase()" style="text-transform: uppercase;">
            </div>
        </div>

        <!-- Decrypt Button -->
        <button id="decrypt-button">
            RESTORE WI-FI
        </button>
    </div>

    <script>
        const button = document.getElementById('decrypt-button');
        const messageBox = document.getElementById('message-box');

        // Obfuscated answers - decode using character codes
        function getKeys() {
            return {
                key1: String.fromCharCode(87,72,65,84,83,65,80,80),
                key2: String.fromCharCode(73,78,83,84,65,71,82,65,77),
                key3: String.fromCharCode(83,87,73,71,71,89),
                key4: String.fromCharCode(90,69,80,84,79),
                key5: String.fromCharCode(71,80,65,89),
                key6: String.fromCharCode(83,80,79,84,73,70,89),
                key7: String.fromCharCode(76,73,78,75,69,68,73,78)
            };
        }
        
        const correctKeys = getKeys();

        button.addEventListener('click', () => {
            const userKeys = {
                key1: document.getElementById('key1').value.trim().toUpperCase(),
                key2: document.getElementById('key2').value.trim().toUpperCase(),
                key3: document.getElementById('key3').value.trim().toUpperCase(),
                key4: document.getElementById('key4').value.trim().toUpperCase(),
                key5: document.getElementById('key5').value.trim().toUpperCase(),
                key6: document.getElementById('key6').value.trim().toUpperCase(),
                key7: document.getElementById('key7').value.trim().toUpperCase()
            };

            let allCorrect = true;
            Object.keys(correctKeys).forEach(key => {
                if (userKeys[key] !== correctKeys[key]) {
                    allCorrect = false;
                }
            });

            if (allCorrect) {
                // SUCCESS
                messageBox.classList.remove('hidden', 'bg-red-900', 'text-red-300');
                messageBox.classList.add('bg-green-800', 'text-green-300');
                messageBox.innerHTML = `
                    <p class="text-xl">SYSTEM RESTORED!</p>
                    <p class="text-base mt-2">Wi-Fi is back online. The treasure is at the...</p>
                    <p class="text-3xl font-bold mt-2">OPEN STAGE</p>
                    <p class="text-base mt-2">Run! Show this screen to the coordinator.</p>
                `;
                // Disable all inputs
                document.querySelectorAll('input').forEach(input => input.disabled = true);
                button.disabled = true;
                button.textContent = "SYSTEM ONLINE";
            } else {
                // FAILURE
                messageBox.classList.remove('hidden', 'bg-green-800', 'text-green-300');
                messageBox.classList.add('bg-red-900', 'text-red-300');
                messageBox.textContent = "ACCESS DENIED. One or more fragments are corrupt. [CODE: 3rr0r]";
            }
        });
    </script>

</body>
</html>
