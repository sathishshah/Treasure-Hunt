<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKT Treasure Hunt</title>
    <style>
        /* Simple blinking caret for the title */
        .caret {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        
        /* Inline CSS for styling */
        body {
            background-color: #111827;
            color: #4ade80;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .container {
            background-color: #000;
            border: 2px solid #22c55e;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 32rem;
            position: relative;
            margin-top: 1rem;
        }
        
        .title-bar {
            position: absolute;
            top: -1rem;
            left: 0;
            right: 0;
            padding: 0 1rem;
        }
        
        .title-bar-content {
            background-color: #374151;
            border: 2px solid #22c55e;
            color: #4ade80;
            text-align: center;
            padding: 0.25rem;
            border-radius: 0.5rem 0.5rem 0 0;
            font-size: 0.875rem;
        }
        
        h1 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-align: center;
            color: #fff;
        }
        
        .intro {
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        
        .error {
            color: #facc15;
        }
        
        #message-box {
            padding: 0.75rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            text-align: center;
            font-weight: bold;
        }
        
        .key-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        
        @media (min-width: 640px) {
            .key-container {
                grid-template-columns: 1fr 1fr;
            }
            h1 {
                font-size: 1.875rem;
            }
            .intro {
                font-size: 1rem;
            }
            .container {
                padding: 2rem;
            }
        }
        
        .key-group {
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        input {
            width: 100%;
            background-color: #1f2937;
            border: 1px solid #16a34a;
            color: #fff;
            padding: 0.5rem;
            border-radius: 0.375rem;
        }
        
        input.correct {
            border-color: #22c55e;
            background-color: #166534;
            padding-right: 2rem;
        }
        
        .checkmark {
            position: absolute;
            right: 0.5rem;
            color: #22c55e;
            font-size: 1.25rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .checkmark.show {
            opacity: 1;
        }
        
        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #22c55e;
        }
        
        button {
            margin-top: 2rem;
            width: 100%;
            background-color: #16a34a;
            color: #000;
            font-weight: bold;
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
            cursor: not-allowed;
            transition: all 0.2s;
            opacity: 0.5;
            pointer-events: none;
        }
        
        button:hover:not(:disabled) {
            background-color: #22c55e;
        }
        
        button:focus {
            outline: none;
            box-shadow: 0 0 0 2px #4ade80;
        }
        
        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
            pointer-events: none;
        }
        
        input:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .hidden {
            display: none;
        }
        
        .bg-red-900 {
            background-color: #7f1d1d;
        }
        
        .text-red-300 {
            color: #fca5a5;
        }
        
        .bg-green-800 {
            background-color: #166534;
        }
        
        .text-green-300 {
            color: #86efac;
        }

        .text-xl {
            font-size: 1.25rem;
        }
        
        .text-base {
            font-size: 1rem;
        }
        
        .text-3xl {
            font-size: 1.875rem;
        }
        
        .font-bold {
            font-weight: bold;
        }
        
        .mt-2 {
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Title Bar -->
        <div class="title-bar">
            <div class="title-bar-content">
                UCEK TERMINAL :: KKT_APP-OCALYPSE_v4.0
            </div>
        </div>

        <h1>
            > KKT APP-OCALYPSE <span class="caret">_</span>
        </h1>
        <p class="intro">
            <span class="error">[ERROR]</span> College Wi-Fi is down. Rogue AI detected.
            <br>
            To find the treasure, you must find 7 'Pass-Fragments' (Keys) by visiting the 7 Hotspots in the Academic Building.
        </p>

        <!-- Message Box for success/error -->
        <div id="message-box" class="hidden"></div>

        <!-- Input Fields for Keys -->
        <div class="key-container">
            <div class="key-group">
                <label for="key1">Pass-Fragment_01:</label>
                <div class="input-wrapper">
                    <input type="text" id="key1" name="key1" oninput="this.value = this.value.toUpperCase(); validateKey('key1')" style="text-transform: uppercase;">
                    <span class="checkmark" id="check1">✓</span>
                </div>
            </div>
            <div class="key-group">
                <label for="key2">Pass-Fragment_02:</label>
                <div class="input-wrapper">
                    <input type="text" id="key2" name="key2" oninput="this.value = this.value.toUpperCase(); validateKey('key2')" style="text-transform: uppercase;">
                    <span class="checkmark" id="check2">✓</span>
                </div>
            </div>
            <div class="key-group">
                <label for="key3">Pass-Fragment_03:</label>
                <div class="input-wrapper">
                    <input type="text" id="key3" name="key3" oninput="this.value = this.value.toUpperCase(); validateKey('key3')" style="text-transform: uppercase;">
                    <span class="checkmark" id="check3">✓</span>
                </div>
            </div>
            <div class="key-group">
                <label for="key4">Pass-Fragment_04:</label>
                <div class="input-wrapper">
                    <input type="text" id="key4" name="key4" oninput="this.value = this.value.toUpperCase(); validateKey('key4')" style="text-transform: uppercase;">
                    <span class="checkmark" id="check4">✓</span>
                </div>
            </div>
            <div class="key-group">
                <label for="key5">Pass-Fragment_05:</label>
                <div class="input-wrapper">
                    <input type="text" id="key5" name="key5" oninput="this.value = this.value.toUpperCase(); validateKey('key5')" style="text-transform: uppercase;">
                    <span class="checkmark" id="check5">✓</span>
                </div>
            </div>
            <div class="key-group">
                <label for="key6">Pass-Fragment_06:</label>
                <div class="input-wrapper">
                    <input type="text" id="key6" name="key6" oninput="this.value = this.value.toUpperCase(); validateKey('key6')" style="text-transform: uppercase;">
                    <span class="checkmark" id="check6">✓</span>
                </div>
            </div>
            <div class="key-group">
                <label for="key7">Pass-Fragment_07 (Final):</label>
                <div class="input-wrapper">
                    <input type="text" id="key7" name="key7" oninput="this.value = this.value.toUpperCase(); validateKey('key7')" style="text-transform: uppercase;">
                    <span class="checkmark" id="check7">✓</span>
                </div>
            </div>
        </div>

        <!-- Decrypt Button -->
        <button id="decrypt-button" disabled>
            RESTORE WI-FI
        </button>
    </div>

    <script>
        const button = document.getElementById('decrypt-button');
        const messageBox = document.getElementById('message-box');

        // Obfuscated answers - decode using character codes
        function getKeys() {
            return {
                key1: String.fromCharCode(87,72,65,84,83,65,80,80),
                key2: String.fromCharCode(73,78,83,84,65,71,82,65,77),
                key3: String.fromCharCode(83,87,73,71,71,89),
                key4: String.fromCharCode(90,69,80,84,79),
                key5: String.fromCharCode(71,80,65,89),
                key6: String.fromCharCode(83,80,79,84,73,70,89),
                key7: String.fromCharCode(76,73,78,75,69,68,73,78)
            };
        }
        
        const correctKeys = getKeys();

        // Function to validate each key individually
        function validateKey(keyId) {
            const input = document.getElementById(keyId);
            const checkmark = document.getElementById('check' + keyId.slice(-1));
            const userValue = input.value.trim().toUpperCase();
            const correctValue = correctKeys[keyId];
            
            if (userValue === correctValue) {
                input.classList.add('correct');
                checkmark.classList.add('show');
                input.disabled = true;
                checkAllComplete();
            } else {
                input.classList.remove('correct');
                checkmark.classList.remove('show');
                input.disabled = false;
            }
        }
        
        // Check if all keys are complete
        function checkAllComplete() {
            let allComplete = true;
            ['key1', 'key2', 'key3', 'key4', 'key5', 'key6', 'key7'].forEach(keyId => {
                if (!document.getElementById(keyId).classList.contains('correct')) {
                    allComplete = false;
                }
            });
            
            if (allComplete) {
                button.disabled = false;
                button.style.opacity = '1';
                button.style.cursor = 'pointer';
            }
        }

        button.addEventListener('click', () => {
            // SUCCESS - All keys are validated
            messageBox.classList.remove('hidden', 'bg-red-900', 'text-red-300');
            messageBox.classList.add('bg-green-800', 'text-green-300');
            messageBox.innerHTML = `
                <p class="text-xl">SYSTEM RESTORED!</p>
                <p class="text-base mt-2">Wi-Fi is back online. The treasure is at the...</p>
                <p class="text-3xl font-bold mt-2">OPEN STAGE</p>
                <p class="text-base mt-2">Run! Show this screen to the coordinator.</p>
            `;
            button.disabled = true;
            button.textContent = "SYSTEM ONLINE";
        });
    </script>

</body>
</html>
